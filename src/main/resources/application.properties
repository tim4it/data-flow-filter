# =============================================================================
# Data-Flow-Filter Configuration
# =============================================================================
# Override by placing config/application.properties next to the executable,
# or pass system properties: -Dserver.port=9090
# =============================================================================

# HTTP server port (1-65535)
server.port=8080

# Thread pool size for the HTTP server
server.thread-pool-size=4

# Path to the SQLite database file (relative to working directory)
database.path=DB/data_flow-filter.db

# CORS settings
cors.allow-origins=*
cors.allow-methods=GET, POST, OPTIONS
cors.allow-headers=Content-Type